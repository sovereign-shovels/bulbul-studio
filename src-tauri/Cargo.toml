[package]
name = "bulbul-studio"
version = "0.1.0"
description = "Desktop studio for Bulbul TTS"
authors = ["Sovereign Shovels"]
license = "Apache-2.0"
repository = "https://github.com/sovereign-shovels/bulbul-studio"
edition = "2021"
rust-version = "1.75"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
toml = "0.8"
dirs = "5"

[features]
custom-protocol = ["tauri/custom-protocol"]
